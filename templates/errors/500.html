{% extends "base.html" %}

{% block title %}Erro interno do servidor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-exclamation-circle fa-4x text-danger mb-4"></i>
                <h1 class="display-4">500</h1>
                <h2 class="mb-4">Erro interno do servidor</h2>
                <p class="text-muted mb-4">
                    Ocorreu um erro inesperado. Nossa equipe foi notificada e estamos trabalhando para resolver o problema.
                </p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Voltar ao início
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
